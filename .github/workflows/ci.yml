name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # components go into the toolchain selected by rust-toolchain.toml
      - run: rustup component add rustfmt clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # JDK 17 is the verification baseline (spec §14); the system java also
      # runs the Tier-1 checker via the single-file source launcher.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # forward-looking doclint on the newest JDK; not a gate
      - uses: actions/setup-java@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          distribution: temurin
          java-version: "25"
      - name: latest-JDK smoke (non-gating)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -q -p wit-java-core --test corpus || echo "latest-JDK drift (non-gating)"
